substitutions:
    startup_sound_file: https://github.com/RASPIAUDIO/esphomeLuxe/raw/refs/heads/main/wav/sounds_timer_finished.wav

esphome:
  name: muse-luxe-music
  friendly_name: Raspiaudio Luxe Music
  min_version: 2026.6.0
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - script.execute: led_red
      # playlist_delay moved from the pipeline config to a runtime action in 2026.7
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: media
          delay: 1500ms
  project:
    name: raspiaudio.music-assistant
    version: "2026.7.0"

esp32:
  variant: esp32
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - esp_http_client
      # sram1_as_iram removed: it takes 128KB away from DRAM, which the sendspin
      # high-performance networking (64 WiFi buffers, 65KB TCP windows) needs at runtime
      # minimum_chip_revision: "3.1"  # optional: saves ~10KB IRAM, but breaks boards with chip rev < 3.1

logger:
  level: warn

api:
  on_client_connected:
    - lambda: |-
        if (!id(boot_sound_played)) {
          id(boot_sound_played) = true;
          if (id(startup_sound_switch).state) {
            id(play_sound)->execute(true, std::string("ready_sound"));
          }
        }

wifi:
#  ssid:
#  password:
  power_save_mode: none
  # If playback stutters with "sendspin.time_burst: Time message timed out" in the logs,
  # lower the TX power: at full power (20dBm) the board desensitizes its own receiver,
  # breaking sendspin time-sync. 8.5dB works well close to the AP; use 11-14dB if far away.
  # output_power: 11dB
  ap:
    ssid: "luxemusic"
    password: "12345678"

psram:
  mode: quad
  speed: 80MHz

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request
update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://raw.githubusercontent.com/RASPIAUDIO/esphomeLuxeMusic/main/manifest_update.json

http_request:

captive_portal:

improv_serial:

external_components:
  - source: github://RASPIAUDIO/esphomeLuxe@main
    components: [es8388]
    refresh: 0s

i2c:
  sda: GPIO18
  scl: GPIO23
  frequency: 100kHz
  id: bus_a

es8388:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin:  GPIO5
#####################
# Internal Components
output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO21
      inverted: true
      mode:
        output: true
speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO26
    dac_type: external
    channel: stereo
    buffer_duration: 1000ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
        buffer_duration: 250ms
      - id: media_mixer_input
        buffer_duration: 250ms

  - platform: resampler
    id: media_resampling_input
    output_speaker: media_mixer_input
    sample_rate: 48000
    buffer_duration: 250ms

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input
    sample_rate: 48000
    buffer_duration: 250ms

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

audio_file:
  - id: ready_sound
    file: ${startup_sound_file}

media_source:
  - platform: sendspin
    id: sendspin_source
    buffer_size: 1000000
    sample_rate: 48000
    # classic ESP32: keep the decoder's stack and working buffers in fast internal RAM;
    # PSRAM here is on the slow SPI bus and starves the FLAC decoder
    decode_memory: internal
  - platform: audio_file
    id: file_source

media_player:
  - platform: sendspin
    id: sendspin_media_player
  - platform: speaker_source
    name: none
    id: external_media_player

    announcement_pipeline:
      speaker: announcement_resampling_input
      sources:
        - file_source
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_input
      sources:
        - sendspin_source
      format: FLAC
      num_channels: 2
      sample_rate: 48000

    volume_increment: 0.05
    volume_min: 0.05
    volume_max: 0.95
    on_state:
      then:
        - lambda: |-
            using media_player::MediaPlayerState;
            auto state = id(external_media_player).state;
            if (
              state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
              state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING
            ) {
              id(led_green).execute();
            } else {
              id(led_red).execute();
            }
script:
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
  - id: led_red
    then:
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

  - id: led_green
    then:
      - light.turn_on:
          id: led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%

switch:
  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO12
      inverted: true
      mode:
        input: true
        output: false
        open_drain: false
        pullup: true
        pulldown: false
      drive_strength: 20.0
    name: Button
    on_press:
      then:
        - media_player.toggle: sendspin_media_player

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Up
    on_click:
      - media_player.volume_up:
          id: external_media_player

  - platform: gpio
    pin:
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: true
    name: Volume Down
    on_click:
      - media_player.volume_down:
          id: external_media_player

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: LED light
    disabled_by_default: false
    entity_category: config
    pin: GPIO22
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

# Quiet heap watchdog: only logs when memory is actually tight. Healthy playback runs
# ~168KB free / 90KB largest block; sustained readings below these thresholds mean the
# network stack is about to starve (the cause of the 2026-07 stutter-then-stop bug).
# Slow-loop issues self-report via ESPHome's built-in "took a long time" warnings.
interval:
  - interval: 15s
    then:
      - lambda: |-
          size_t free_internal = heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
          size_t largest = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
          if (free_internal < 60 * 1024 || largest < 24 * 1024) {
            ESP_LOGW("heap_canary", "Internal heap low: %u B free, largest block %u B", free_internal, largest);
          }

sensor:
 - platform: wifi_signal
   name: WiFi Signal
   update_interval: 30s
   entity_category: diagnostic
 - platform: adc
   pin: GPIO33
   name: Battery
   icon: "mdi:battery-outline"
   update_interval: 15s
   accuracy_decimals: 3
   attenuation: 12db
   raw: true
   filters:
    - multiply: 0.00173913 # 2300 -> 4, for attenuation 11db, based on Olivier's code
    - exponential_moving_average:
        alpha: 0.2
        send_every: 2
    - delta: 0.002
